# Builds FolderTags.dll and its setup from source on a GitHub-hosted runner and, when enabled,
# signs both through SignPath (free code signing for open source projects, see
# installer/SIGNING.md). The DLL and the uninstaller (unins000.exe) are signed before they go
# into the setup, then the setup itself is signed: Store policy 10.2.9 wants every PE file
# signed. Nothing is published: the files are uploaded as a workflow artifact.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Product version (x.y.z)
        required: true
        default: '1.2.0'
      sign:
        description: Sign with SignPath (needs the SignPath secret and variables)
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

env:
  # Inno Setup 6.7.3, checksum from the winget manifest (JRSoftware.InnoSetup).
  INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  release:
    runs-on: windows-latest
    # Each signing request waits up to 1 hour for its manual approval in SignPath.
    timeout-minutes: 150
    env:
      SIGN: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign) || (github.event_name == 'push' && vars.SIGNPATH_ENABLED == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SignPath settings
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          ORGANIZATION: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:HAS_TOKEN -ne 'true' -or -not $env:ORGANIZATION -or -not $env:PROJECT -or -not $env:POLICY) {
            throw 'Signing needs the SIGNPATH_API_TOKEN secret and the SIGNPATH_* variables (installer/SIGNING.md).'
          }

      - name: Resolve version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:EVENT -eq 'push') { $env:TAG.TrimStart('v') } else { $env:INPUT_VERSION }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be x.y.z, got '$v'." }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $env:INNO_URL -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw 'Inno Setup checksum mismatch.' }
          $p = Start-Process $exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed ($($p.ExitCode))." }

      - name: Build FolderTags.dll
        shell: pwsh
        run: ./scripts/build.ps1 -Version $env:VERSION

      # --- SignPath, step 1: the DLL and the uninstaller (artifact configuration "binaries") ---
      - name: Prepare DLL and uninstaller for signing
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          # In signed-uninstaller mode the first compile only writes uninst-*.e32, then exits 3.
          ./scripts/build-installer.ps1 -Version $env:VERSION -SkipBuild -SignedUninstallerDir signing/uninstaller
          if ($LASTEXITCODE -ne 3) { throw "Expected the unsigned uninstaller (exit code 3), got $LASTEXITCODE." }
          New-Item -ItemType Directory signing/unsigned | Out-Null
          Copy-Item build/FolderTags.dll signing/unsigned/
          # SignPath recognizes PE files by their extension: the .e32 file travels as .exe.
          Get-ChildItem signing/uninstaller -Filter uninst-*.e32 | ForEach-Object {
            Copy-Item $_.FullName (Join-Path signing/unsigned "$($_.BaseName).exe")
          }
          exit 0

      - name: Upload unsigned DLL and uninstaller
        id: upload-binaries
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FolderTags-binaries-unsigned
          path: signing/unsigned/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign DLL and uninstaller
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed

      - name: Use signed DLL and uninstaller
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $signed = Get-ChildItem signing/signed -File
          Get-AuthenticodeSignature -FilePath $signed.FullName | ForEach-Object {
            # A test-signing certificate is untrusted; a release one must be valid.
            if ($_.Status -eq 'NotSigned' -or ($_.Status -ne 'Valid' -and $env:POLICY -notlike 'test*')) {
              throw "$($_.Path): $($_.Status)"
            }
          }
          Copy-Item signing/signed/FolderTags.dll build/FolderTags.dll -Force
          $signed | Where-Object Name -like 'uninst-*.exe' | ForEach-Object {
            Copy-Item $_.FullName (Join-Path signing/uninstaller "$($_.BaseName).e32") -Force
          }

      - name: Build setup
        shell: pwsh
        run: |
          $signing = if ($env:SIGN -eq 'true') { @{ SignedUninstallerDir = 'signing/uninstaller' } } else { @{} }
          ./scripts/build-installer.ps1 -Version $env:VERSION -SkipBuild @signing

      # --- SignPath, step 2: the setup (artifact configuration "setup") ---
      - name: Upload unsigned setup
        id: upload-setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FolderTags-setup-unsigned
          path: dist/FolderTags-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Sign setup
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signing/signed-setup

      - name: Use signed setup
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          $setup = "signing/signed-setup/FolderTags-Setup-$env:VERSION.exe"
          $status = (Get-AuthenticodeSignature -FilePath $setup).Status
          if ($status -eq 'NotSigned' -or ($status -ne 'Valid' -and $env:POLICY -notlike 'test*')) {
            throw "${setup}: $status"
          }
          Copy-Item $setup dist/ -Force

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FolderTags-${{ env.VERSION }}${{ env.SIGN != 'true' && '-unsigned' || '' }}
          path: |
            dist/FolderTags-Setup-${{ env.VERSION }}.exe
            build/FolderTags.dll
          if-no-files-found: error
          overwrite: true
